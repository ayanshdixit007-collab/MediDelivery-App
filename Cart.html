<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - MediDelivery</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #00b894 !important; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; }
        .cart-card { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; transition: 0.3s; }
        .cart-card:hover { box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .summary-card { background-color: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 25px; position: sticky; top: 100px; }
        .btn-checkout { background-color: #00b894; color: white; border-radius: 25px; padding: 12px; font-weight: bold; width: 100%; transition: 0.3s; border: none; margin-top: 15px; }
        .btn-checkout:hover { background-color: #009678; color: white; transform: translateY(-2px); }
        .btn-remove { color: #d63031; background: none; border: none; font-size: 1.2rem; transition: 0.3s; }
        .btn-remove:hover { color: #c0392b; transform: scale(1.1); }
        .empty-cart-icon { font-size: 5rem; color: #b2bec3; margin-bottom: 20px; }
        .item-price { font-size: 1.2rem; font-weight: 700; color: #2d3436; }
    </style>
</head>
<body>

    <!-- Professional Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="homepage.html"><i class="fas fa-heartbeat me-2"></i>MediDelivery</a>
            <div class="d-flex align-items-center">
                <a href="homepage.html" class="btn btn-outline-light rounded-pill px-4"><i class="fas fa-arrow-left me-2"></i>Back to Shop</a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <div class="container mt-5 mb-5">
        <h2 class="fw-bold mb-4 text-secondary"><i class="fas fa-shopping-bag me-2"></i>Your Shopping Cart</h2>
        
        <div class="row" id="cartContent">
            <!-- Left Side: Cart Items -->
            <div class="col-lg-8" id="cartItemsContainer">
                <!-- Items will be injected here by JS -->
            </div>

            <!-- Right Side: Order Summary -->
            <div class="col-lg-4" id="orderSummary" style="display: none;">
                <div class="summary-card">
                    <h4 class="fw-bold border-bottom pb-3 mb-4">Order Summary</h4>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Subtotal</span>
                        <span class="fw-bold">₹<span id="subtotalAmount">0</span></span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted">Delivery Charges</span>
                        <span class="text-success fw-bold">FREE</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <strong class="fs-5">Total Amount</strong>
                        <strong class="fs-5 text-primary">₹<span id="totalPrice">0</span></strong>
                    </div>
                    <button class="btn-checkout" onclick="placeOrder()">
                        <i class="fas fa-check-circle me-2"></i>Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Authentication Check
        if (!localStorage.getItem('activeUser')) {
            window.location.href = "login.html";
        }

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartContainer = document.getElementById('cartItemsContainer');
        const orderSummary = document.getElementById('orderSummary');

        function renderCart() {
            cartContainer.innerHTML = ""; 
            let totalAmount = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="text-center py-5 bg-white rounded-4 shadow-sm">
                        <i class="fas fa-shopping-cart empty-cart-icon"></i>
                        <h3 class="text-muted fw-bold">Your cart is empty</h3>
                        <p class="text-muted mb-4">Looks like you haven't added any medicines yet.</p>
                        <a href="homepage.html" class="btn btn-primary rounded-pill px-4">Browse Medicines</a>
                    </div>
                `;
                orderSummary.style.display = "none";
            } else {
                cart.forEach((item, index) => {
                    totalAmount += item.price;
                    
                    // DOM Manipulation for injecting cards[cite: 24]
                    cartContainer.innerHTML += `
                        <div class="card cart-card p-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <div class="bg-light rounded p-3 me-3">
                                        <i class="fas fa-pills text-primary fs-3"></i>
                                    </div>
                                    <div>
                                        <h5 class="fw-bold mb-1">${item.name}</h5>
                                        <small class="text-success"><i class="fas fa-truck me-1"></i>Eligible for Express Delivery</small>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <span class="item-price me-4">₹${item.price}</span>
                                    <button class="btn-remove" onclick="removeItem(${index})" title="Remove Item">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                document.getElementById('subtotalAmount').innerText = totalAmount;
                document.getElementById('totalPrice').innerText = totalAmount;
                orderSummary.style.display = "block";
            }
        }

        function removeItem(index) {
            cart.splice(index, 1); 
            localStorage.setItem('cart', JSON.stringify(cart)); // Updating storage[cite: 26]
            renderCart(); 
        }

        function placeOrder() {
            alert('Order Placed Successfully! Your medicines will be delivered in 30 minutes.');
            localStorage.removeItem('cart'); // Clear cart[cite: 26]
            window.location.href = "homepage.html"; 
        }

        // Initial Render
        renderCart();
    </script>
</body>
</html>
