<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediDelivery - Your Online Pharmacy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #00b894 !important; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 800; font-size: 1.5rem; letter-spacing: 1px; }
        .hero-section { background: linear-gradient(135deg, #00b894, #55efc4); color: white; padding: 60px 0; text-align: center; margin-bottom: 40px; border-radius: 0 0 30px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .hero-section h1 { font-weight: 700; margin-bottom: 20px; }
        .search-bar { max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 25px; overflow: hidden; }
        .search-bar input { border: none; padding: 15px 20px; outline: none; }
        .search-bar button { background-color: #2d3436; color: white; border: none; padding: 15px 25px; transition: 0.3s; }
        .search-bar button:hover { background-color: #000; }
        .med-card { border: none; border-radius: 15px; transition: transform 0.3s, box-shadow 0.3s; overflow: hidden; }
        .med-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .med-image { height: 200px; object-fit: contain; padding: 20px; background: white; }
        .badge-category { background-color: #ffeaa7; color: #d63031; border-radius: 20px; padding: 5px 15px; font-weight: 600; font-size: 0.8rem; }
        .price-tag { font-size: 1.4rem; font-weight: 800; color: #2d3436; }
        .btn-add { background-color: #0984e3; color: white; border-radius: 25px; padding: 8px 20px; font-weight: 600; transition: 0.3s; }
        .btn-add:hover { background-color: #74b9ff; color: white; }
        
        /* Toast Notification Styling */
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 25px; padding: 16px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 17px; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <!-- Professional Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-heartbeat me-2"></i>MediDelivery</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 fw-bold" id="welcomeMsg"><i class="fas fa-user-circle me-1"></i> </span>
                <a href="cart.html" class="btn btn-light position-relative rounded-pill px-4 me-2">
                    <i class="fas fa-shopping-cart me-1"></i> Cart
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
                </a>
                <button class="btn btn-outline-light rounded-pill px-3" onclick="handleLogOut()"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="container">
            <h1>Fast, Reliable Medicine Delivery</h1>
            <p class="lead mb-4">Get your healthcare essentials delivered to your doorstep in 30 minutes.</p>
            <div class="input-group search-bar">
                <input type="text" class="form-control" id="searchInput" placeholder="Search for medicines, supplements..." onkeyup="filterMedicines()">
                <button class="btn" type="button"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </div>

    <!-- Medicine Grid -->
    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-secondary">Trending Products</h2>
        </div>
        <div class="row g-4" id="medicineList">
            <!-- JavaScript will populate cards here -->
        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast"><i class="fas fa-check-circle me-2 text-success"></i><span id="toastMsg">Item added to cart!</span></div>

    <script>
        // Check Login
        const activeUser = localStorage.getItem('activeUser');
        if (!activeUser) window.location.href = "login.html";
        else document.getElementById('welcomeMsg').innerHTML += activeUser.split('@')[0]; // Shows username before @

        // Realistic Medicine Data
        const medicines = [
            { id: 1, name: "Paracetamol 500mg", category: "Fever & Pain", price: 30, image: "https://cdn-icons-png.flaticon.com/512/3014/3014444.png" },
            { id: 2, name: "Benadryl Cough Syrup", category: "Cold & Cough", price: 115, image: "https://cdn-icons-png.flaticon.com/512/822/822092.png" },
            { id: 3, name: "Vitamin C Zincotab", category: "Immunity", price: 150, image: "https://cdn-icons-png.flaticon.com/512/4887/4887968.png" },
            { id: 4, name: "Dettol First Aid Kit", category: "Essentials", price: 350, image: "https://cdn-icons-png.flaticon.com/512/2869/2869389.png" },
            { id: 5, name: "Vicks Vaporub 50g", category: "Cold & Cough", price: 85, image: "https://cdn-icons-png.flaticon.com/512/4320/4320350.png" },
            { id: 6, name: "Eno Regular 100g", category: "Digestion", price: 60, image: "https://cdn-icons-png.flaticon.com/512/5753/5753365.png" }
        ];

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cartCount').innerText = cart.length;

        // Render Function
        function renderMedicines(data) {
            const list = document.getElementById('medicineList');
            list.innerHTML = "";
            data.forEach(med => {
                list.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card med-card h-100 shadow-sm">
                            <img src="${med.image}" class="card-img-top med-image" alt="${med.name}">
                            <div class="card-body text-center d-flex flex-column">
                                <span class="badge-category mb-2 align-self-center">${med.category}</span>
                                <h5 class="card-title fw-bold">${med.name}</h5>
                                <div class="mt-auto pt-3 d-flex justify-content-between align-items-center">
                                    <span class="price-tag">₹${med.price}</span>
                                    <button class="btn btn-add" onclick="addToCart(${med.id}, '${med.name}', ${med.price})">
                                        <i class="fas fa-plus me-1"></i> Add
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        renderMedicines(medicines);

        // Filter Logic
        function filterMedicines() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = medicines.filter(med => med.name.toLowerCase().includes(query) || med.category.toLowerCase().includes(query));
            renderMedicines(filtered);
        }

        // Add to Cart with Toast
        function addToCart(id, name, price) {
            cart.push({ id, name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').innerText = cart.length;
            showToast(`${name} added to cart!`);
        }

        // Toast Notification Function
        function showToast(message) {
            const toast = document.getElementById("toast");
            document.getElementById("toastMsg").innerText = message;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function handleLogOut() {
            localStorage.removeItem('activeUser');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
