<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MediDelivery</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; max-width: 900px; width: 100%; }
        .bg-image { background: linear-gradient(135deg, #0984e3, #74b9ff); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; }
        .bg-image i { font-size: 5rem; margin-bottom: 20px; }
        .form-section { padding: 50px; background: white; }
        .btn-login { background-color: #0984e3; color: white; border-radius: 25px; padding: 12px; font-weight: bold; width: 100%; transition: 0.3s; border: none; font-size: 1.1rem; margin-top: 10px; }
        .btn-login:hover { background-color: #0652dd; color: white; transform: translateY(-2px); }
        .form-floating:focus-within label { color: #0984e3; }
        .form-control:focus { border-color: #0984e3; box-shadow: 0 0 0 0.25rem rgba(9, 132, 227, 0.25); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card auth-card flex-row-reverse">
            <!-- Right Side Branding -->
            <div class="col-md-5 d-none d-md-flex bg-image">
                <i class="fas fa-user-shield"></i>
                <h2 class="fw-bold mb-3">Welcome Back!</h2>
                <p>Login to track your orders, manage your cart, and get express delivery.</p>
            </div>
            
            <!-- Left Side Form -->
            <div class="col-md-7 form-section">
                <h3 class="fw-bold mb-4 text-secondary">Login to your account</h3>
                
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="loginUsername" placeholder="Username" required>
                    <label for="loginUsername"><i class="fas fa-user me-2 text-muted"></i>Username</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                    <label for="loginPassword"><i class="fas fa-lock me-2 text-muted"></i>Password</label>
                </div>

                <button class="btn-login" onclick="handleLogin()">Login to Dashboard</button>
                
                <p class="text-center mt-4 text-muted">
                    Don't have an account? <a href="register.html" class="text-decoration-none fw-bold" style="color: #0984e3;">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;
            
            // Retrieve data from local storage[cite: 26]
            const storedUserString = localStorage.getItem('registeruser');
            
            if (!storedUserString) {
                alert("No account found. Please register first.");
                return;
            }

            const storedUser = JSON.parse(storedUserString);

            if (user === storedUser.username && pass === storedUser.password) {
                localStorage.setItem('activeUser', user);
                window.location.href = "homepage.html"; 
            } else {
                alert("Invalid username or password!");
            }
        }
    </script>
</body>
</html>
